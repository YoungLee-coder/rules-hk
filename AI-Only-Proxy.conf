# Shadowrocket — 海外 AI 代理，中国大陆 AI 及其余流量直连
# 编写及域名核对日期：2026-10-07（仅保留 7 个服务策略组）
# 使用：首页选择可用代理节点；全局路由选择「配置」；启用本文件。
# PROXY 使用首页选中的节点。本文件不包含节点或订阅。
# AI 专属网站、API、资源、客户端更新均视为 AI 流量。
# 中国大陆 AI 使用 DIRECT；包括已列品牌的国际站域名（如 kimi.ai、qwen.ai、trae.ai）。
# DOMAIN-SUFFIX 同时匹配根域名及任意层级子域名，不要写成 *.example.com。
# 本文件是静态规则快照，不会自动更新。无法保证覆盖未来新增域名。
# 不启用 HTTPS 解密；不依赖远程规则集；未匹配流量始终 DIRECT。
# 共享登录/验证码/CDN 默认直连，兼容性说明见文件末尾及随附说明。

[General]
dns-server = system
direct-dns-server = system
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
dns-direct-fallback-proxy = false
udp-policy-not-supported-behaviour = REJECT

[Proxy Group]
# 每个服务一个策略组：在 Shadowrocket「首页」点开对应组即可单独选节点或直连。
# DIRECT = 该服务走直连；PROXY = 首页当前节点；policy-regex-filter=.* 会把订阅里全部节点也列入选单。
# 想按地区筛选可改成如 policy-regex-filter=(日本|美国|新加坡)。中国大陆 AI 规则段仍为 DIRECT。
Cursor = select,DIRECT,PROXY,policy-regex-filter=.*
OpenAI = select,DIRECT,PROXY,policy-regex-filter=.*
Claude = select,DIRECT,PROXY,policy-regex-filter=.*
Gemini = select,DIRECT,PROXY,policy-regex-filter=.*
Krill = select,DIRECT,PROXY,policy-regex-filter=.*
Kiro = select,DIRECT,PROXY,policy-regex-filter=.*
Manus = select,DIRECT,PROXY,policy-regex-filter=.*

[Rule]

