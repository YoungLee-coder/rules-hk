# Shadowrocket — 仅列需分流的海外 AI 域名；未匹配流量由 FINAL 直连
# 编写及域名核对日期：2026-10-07（仅 7 个服务 + 分流域名）
# 使用：首页选择可用代理节点；全局路由选择「配置」；启用本文件。
# PROXY 使用首页选中的节点。本文件不包含节点或订阅。
# 中国大陆 AI 等未写入的域名不单独列规则，一律随 FINAL,DIRECT 直连。
# DOMAIN-SUFFIX 同时匹配根域名及任意层级子域名，不要写成 *.example.com。
# 本文件是静态规则快照，不会自动更新。无法保证覆盖未来新增域名。
# 不启用 HTTPS 解密；不依赖远程规则集；未匹配流量始终 DIRECT。
# 共享登录/验证码/CDN 默认直连，兼容性说明见文件末尾及随附说明。

[General]
dns-server = system
direct-dns-server = system
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
dns-direct-fallback-proxy = false
udp-policy-not-supported-behaviour = REJECT

[Proxy Group]
# 勿在同一行写 policy-regex-filter 与 DIRECT/PROXY：Shadowrocket 会只显示筛出的节点，直连/跟随主节点会消失。
# DIRECT = 直连；PROXY = 跟随首页当前节点；「xxx-选节点」= 进入后自选订阅节点（各服务独立，互不影响）。
# 地区筛选示例：Cursor-选节点 = select,policy-regex-filter=(香港|HK|🇭🇰)
Cursor-选节点 = select,policy-regex-filter=.*
OpenAI-选节点 = select,policy-regex-filter=.*
Claude-选节点 = select,policy-regex-filter=.*
Gemini-选节点 = select,policy-regex-filter=.*
Krill-选节点 = select,policy-regex-filter=.*
Kiro-选节点 = select,policy-regex-filter=.*
Manus-选节点 = select,policy-regex-filter=.*
Cursor = select,DIRECT,PROXY,Cursor-选节点,policy-select-name=PROXY
OpenAI = select,DIRECT,PROXY,OpenAI-选节点,policy-select-name=PROXY
Claude = select,DIRECT,PROXY,Claude-选节点,policy-select-name=PROXY
Gemini = select,DIRECT,PROXY,Gemini-选节点,policy-select-name=PROXY
Krill = select,DIRECT,PROXY,Krill-选节点,policy-select-name=PROXY
Kiro = select,DIRECT,PROXY,Kiro-选节点,policy-select-name=PROXY
Manus = select,DIRECT,PROXY,Manus-选节点,policy-select-name=PROXY

