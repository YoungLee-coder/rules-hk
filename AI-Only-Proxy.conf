# Shadowrocket — 海外 AI 代理，中国大陆 AI 及其余流量直连
# 编写及域名核对日期：2026-10-01
# 使用：首页选择可用代理节点；全局路由选择「配置」；启用本文件。
# PROXY 使用首页选中的节点。本文件不包含节点或订阅。
# AI 专属网站、API、资源、客户端更新均视为 AI 流量。
# 中国大陆 AI 使用 DIRECT；包括已列品牌的国际站域名（如 kimi.ai、qwen.ai、trae.ai）。
# DOMAIN-SUFFIX 同时匹配根域名及任意层级子域名，不要写成 *.example.com。
# 本文件是静态规则快照，不会自动更新。无法保证覆盖未来新增域名。
# 不启用 HTTPS 解密；不依赖远程规则集；未匹配流量始终 DIRECT。
# 共享登录/验证码/CDN 默认直连，兼容性说明见文件末尾及随附说明。

[General]
dns-server = system
direct-dns-server = system
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
dns-direct-fallback-proxy = false
udp-policy-not-supported-behaviour = REJECT

[Proxy Group]
# 每个服务一个策略组：在 Shadowrocket「首页」点开对应组即可单独选节点。
# 默认第一项 PROXY = 首页当前节点；policy-regex-filter=.* 会把你所有节点并入各组供选择。
# 想按地区筛选可改成如 policy-regex-filter=(日本|美国|新加坡)。中国大陆 AI 仍为 DIRECT。
AI-Cursor = select,PROXY,DIRECT,policy-regex-filter=.*
AI-OpenAI = select,PROXY,DIRECT,policy-regex-filter=.*
AI-Claude = select,PROXY,DIRECT,policy-regex-filter=.*
AI-Gemini = select,PROXY,DIRECT,policy-regex-filter=.*
AI-Copilot = select,PROXY,DIRECT,policy-regex-filter=.*
AI-GitHubCopilot = select,PROXY,DIRECT,policy-regex-filter=.*
AI-Windsurf = select,PROXY,DIRECT,policy-regex-filter=.*
AI-JetBrainsAI = select,PROXY,DIRECT,policy-regex-filter=.*
Other IDE = select,PROXY,DIRECT,policy-regex-filter=.*
AI-Krill = select,PROXY,DIRECT,policy-regex-filter=.*
AI-AIPlatforms = select,PROXY,DIRECT,policy-regex-filter=.*
AI-AICreative = select,PROXY,DIRECT,policy-regex-filter=.*

[Rule]

