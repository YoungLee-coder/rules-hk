# Shadowrocket — 海外 AI 代理，国内 AI 及其余流量直连
# 编写及域名核对日期：2026-09-05
# 使用：首页选择可用代理节点；全局路由选择「配置」；启用本文件。
# PROXY 使用首页选中的节点。本文件不包含节点或订阅。
# AI 专属网站、API、资源、客户端更新均视为 AI 流量。
# 国内 AI 使用 DIRECT；包括已列品牌的国际站域名（如 kimi.ai、qwen.ai、trae.ai）。
# DOMAIN-SUFFIX 同时匹配根域名及任意层级子域名，不要写成 *.example.com。
# 本文件是静态规则快照，不会自动更新。无法保证覆盖未来新增域名。
# 不启用 HTTPS 解密；不依赖远程规则集；未匹配流量始终 DIRECT。
# 共享登录/验证码/CDN 默认直连，兼容性说明见文件末尾及随附说明。

[General]
dns-server = system
direct-dns-server = system
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
dns-direct-fallback-proxy = false
udp-policy-not-supported-behaviour = REJECT

[Rule]

